# Render deployment configuration
# Deploy: https://render.com/docs

services:
  - type: web
    name: kanban-api
    runtime: docker
    region: ohio
    plan: free
    dockerfilePath: api/Dockerfile
    rootDir: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_HOST
        fromDatabase:
          name: kanban-db
          property: host
      - key: DB_PORT
        value: 5432
      - key: DB_USER
        fromDatabase:
          name: kanban-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: kanban-db
          property: password
      - key: DB_NAME
        value: kanban_db
      - key: JWT_SECRET
        sync: false  # Gere uma chave segura e defina manualmente
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: kanban-db
    engine: postgres
    version: 15
    plan: free
    region: ohio
